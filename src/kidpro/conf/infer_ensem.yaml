defaults:
  - hydra: default
  - model: prov_gigapath
  - train: default_wsi
  - dataset: wsi
  - mlflow: default_wsi
  - core: default
  - _self_

# CSV inference using cached MIL embeddings.
infer_ensem:
  # --- Input / output ---
  csv_path: /home/khdp-user/workspace/dataset/CSV/GT_label.csv
  output_dir: ${hydra:run.dir}
  output_csv: submission.csv

  # --- Column mapping ---
  # slide_id_col: the column that contains the slide identifier (used to resolve paths + output ID).
  # split_col: the column used to filter "test" rows for output.
  slide_id_col: SlideName
  gt_col: GT
  split_col: split
  test_value: test

  # --- Inference settings ---
  threshold: 0.5
  amp: auto                # auto|true|false
  require_cached_embeddings: true

  # --- Weights ---
  # If weights_path is null:
  # - if mlflow.enabled=true, uses the best model from registry
  # - else falls back to models/best_model.pt (repo-relative)
  weights_path: null
