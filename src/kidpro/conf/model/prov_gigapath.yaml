name: prov_gigapath
arch: prov_gigapath

# --- LongNet MIL head knobs ---
longnet_dim: 768
longnet_depth: 12
longnet_slide_ngrids: 1000
longnet_max_wsi_size: 262144
longnet_dropout: 0.35
longnet_pretrained: true

# --- Aggregator selection and input conditioning ---
# aggregator_type: longnet, mean_pool, or max_pool
aggregator_type: longnet
longnet_input_norm: true
longnet_input_dropout: 0.2
longnet_weights:
  source: local
  local_path: /home/khdp-user/workspace/huggingface_cache/prov_gigapath/slide_encoder.pth
  hf_cache_path: /home/khdp-user/workspace/huggingface_cache

num_classes: 2
in_channels: 3
pretrained: false

# --- Weights loading (network-robust) ---
# source: local | hf_cache
weights:
  source: local
  local_path: /home/khdp-user/workspace/huggingface_cache/prov_gigapath/pytorch_model.bin
  hf_cache_path: /home/khdp-user/workspace/huggingface_cache

# --- LORA knobs ---
lora:
  enabled: true
  apply_to:
  - longnet
  - backbone
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "out_proj"
    - "proj"
    - "qkv"

freeze_backbone: true

# --- Foundation backbone ---
foundation_dim: 1536

# --- Input expectations (center-cropped from data.patch_size tiles) ---
input_size: 224
