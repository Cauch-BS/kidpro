# Configuration for building tile embedding cache.
#
# Caches tile embeddings for ALL slides in the label_csv, regardless of
# train/val/test split. This makes the cache reusable across different
# split configurations.
#
# Usage:
#   python -m kidpro.build_cache                                # Use defaults
#   python -m kidpro.build_cache cache.batch_size=64            # Larger batches
#   python -m kidpro.build_cache model=uni2_h                   # Different encoder
#   python -m kidpro.build_cache cache.force_rebuild=true       # Rebuild all

defaults:
  - hydra: default
  - model: prov_gigapath
  - train: default_wsi
  - dataset: wsi
  - mlflow: default_wsi
  - core: default
  - _self_

# Cache-specific configuration
cache:
  # Batch size for tile encoding (larger = faster but more VRAM)
  batch_size: 32

  # Skip slides that already have valid cached embeddings
  skip_existing: true

  # Force rebuild even if cache exists and is valid
  force_rebuild: false
