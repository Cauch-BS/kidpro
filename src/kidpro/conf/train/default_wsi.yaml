batch_size: 4
epochs: 100
lr: 3e-5
seed: 42

# Class imbalance handling
use_class_weights: false
use_balanced_sampling: true

# Optimizer settings
dropout: 0.25
weight_decay: 0.05
head_lr_multiplier: 3.0

# Scheduler settings
warmup_epochs: 10
scheduler_type: cosine  # cosine, step, or none
gradient_clip: 1.0

# Sanity check mode (for quick iteration)
sanity_check: false
sanity_check_samples: 10

early_stopping:
  patience: 8
  min_delta: 1e-4
  mode: max
  metric: val_pr_auc  # val_loss, val_auc, val_pr_auc, or val_macro_f1
